
name: Project 2

on:
  push:
    branches:
      - main
    paths:
      - 'project-2-docker-cicd/**'
      - '.github/workflows/project-2-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984220190692:role/project-2-github-role
          aws-region: eu-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: project-2-webserver
          IMAGE_TAG: latest
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            ./project-2-docker-cicd

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Pull Docker image on EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "i-021b7c8574eed06f0" \
            --parameters '{"commands":["set -e","aws ecr get-login-password --region eu-west-2 | sudo docker login --username AWS --password-stdin 984220190692.dkr.ecr.eu-west-2.amazonaws.com","sudo docker pull 984220190692.dkr.ecr.eu-west-2.amazonaws.com/project-2-webserver:latest"]}' \
            --region eu-west-2 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-021b7c8574eed06f0" \
            --region eu-west-2

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-021b7c8574eed06f0" \
            --region eu-west-2 \
            --query "[Status,StandardOutputContent]" \
            --output text
