
name: Project_2

on:
  push:
    branches:
      - main
    paths:
      - 'project-2-docker-cicd/**'
      - '.github/workflows/project-2-deploy.yml'

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984220190692:role/project-2-github-role
          aws-region: eu-west-2
      


      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: project-2-webserver
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./project-2-docker-cicd
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to Amazon ECS
         run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript"
            --targets "Key=tag:Name,Values=project-2-ec2" \
            --comment "Deploying Docker image to ECS" \
          -- region eu-west-2 \
      
      